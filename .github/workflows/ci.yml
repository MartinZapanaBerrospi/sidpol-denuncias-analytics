name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pruebas (limpieza, modelo curado, análisis y tablero)
        run: pytest -q
      - name: El modelo curado coincide con las cifras oficiales de Perú Compras
        run: python -m src.validate
      - name: El tablero versionado es el que producen los generadores
        run: |
          python tools/build_model.py
          python tools/build_report.py
          git diff --exit-code -- powerbi ':!powerbi/perucompras.SemanticModel/definition/expressions.tmdl'
