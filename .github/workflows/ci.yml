name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Los archivos originales (data/raw) no se versionan: el portal no permite descargarlos por
      # script. Las pruebas usan recortes reales (tests/fixtures) y los reportes y el modelo curado
      # versionados, que contienen el resultado de cada validación.
      - name: Pruebas (lectura, calidad, validaciones y modelo)
        run: pytest -q
